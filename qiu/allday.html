  --brand: #f7b500;
  --brand-dark: #9a5b00;
  --blue: #2458d3;
  --green: #0f8f6e;
  --red: #bf3d2f;
  --shadow: 0 18px 46px rgba(31, 42, 68, .12);

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  color: var(--ink);
  font-family: var(--sans);
  background:
    radial-gradient(circle at 16% 10%, rgba(255, 224, 108, .35), transparent 24%),
    radial-gradient(circle at 88% 16%, rgba(93, 148, 255, .18), transparent 26%),
    linear-gradient(180deg, #fffdf5 0%, #f7f9fc 46%, #edf5ff 100%);
}
button, input { font: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible {
  outline: 3px solid rgba(36, 88, 211, .28);
  outline-offset: 2px;
}
.app-shell {
  min-height: 100vh;
  display: grid;
  grid-template-columns: minmax(230px, 282px) minmax(0, 1fr);
  transition: grid-template-columns .18s ease;
}
.app-shell.rail-collapsed { grid-template-columns: 74px minmax(0, 1fr); }
.side-rail {
  position: sticky;
  top: 0;
  height: 100vh;
  padding: 18px;
  background: rgba(255, 255, 255, .92);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 16px;
  overflow: hidden;
}
.rail-toggle {
  position: absolute;
  right: -15px;
  top: 80px;
  width: 30px;
  height: 42px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: #fff;
  box-shadow: 0 8px 22px rgba(31,42,68,.16);
  color: #17325c;
}
.rail-toggle span { display: inline-block; transition: transform .16s ease; }
.app-shell.rail-collapsed .rail-toggle span { transform: rotate(180deg); }
.brand {
  display: grid;
  grid-template-columns: 48px 1fr;
  gap: 10px;
  align-items: center;
}
.brand img {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  object-fit: contain;
}
.brand strong { display:block; font-size: 17px; line-height: 1.18; }
.brand span { display:block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.course-meta {
  border: 1px solid #f4d56f;
  background: #fff8d9;
  color: #60410a;
  border-radius: 14px;
  padding: 10px 12px;
  font-size: 13px;
  line-height: 1.45;
}
.nav-list {
  display: grid;
  gap: 8px;
  overflow: auto;
  padding-right: 2px;
}
.nav-button {
  border: 1px solid transparent;
  border-radius: 12px;
  background: transparent;
  color: var(--muted);
  padding: 10px 12px;
  display: flex;
  gap: 10px;
  align-items: center;
  text-align: left;
  white-space: nowrap;
}
.nav-button[aria-current="true"] {
  background: #fff6d6;
  border-color: #f3c64b;
  color: #4b3410;
  box-shadow: 0 8px 24px rgba(247,181,0,.18);
}
.nav-index {
  width: 24px;
  height: 24px;
  flex: 0 0 24px;
  border-radius: 999px;
  background: #eef4ff;
  color: #17325c;
  display:grid;
  place-items:center;
  font-size: 13px;
  font-weight: 800;
}
.nav-label { overflow: hidden; text-overflow: ellipsis; }
.app-shell.rail-collapsed .brand { grid-template-columns: 48px; }
.app-shell.rail-collapsed .brand div,
.app-shell.rail-collapsed .course-meta,
.app-shell.rail-collapsed .nav-label { display:none; }
.app-shell.rail-collapsed .nav-button { justify-content:center; padding-left: 7px; padding-right: 7px; }
.workspace {
  min-width: 0;
  padding: 24px clamp(22px, 3vw, 46px) 92px;
}
.stage {
  min-height: min(620px, calc(100vh - 116px));
  background: rgba(255,255,255,.94);
  border: 1px solid rgba(255, 190, 75, .38);
  border-radius: 28px;
  box-shadow: var(--shadow);
  padding: clamp(20px, 2.7vw, 36px);
  overflow: hidden;
  display: grid;
  align-content: center;
}
.stage::before {
  content: "🍋";
  position: absolute;
  right: 34px;
  top: 24px;
  font-size: 42px;
  opacity: .25;
}
.page {
  position: relative;
  animation: rise .18s ease-out;
}
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.eyebrow {
  margin: 0 0 10px;
  color: var(--brand-dark);
  font-weight: 900;
  letter-spacing: 0;
}
h1 {
  margin: 0;
  font-size: clamp(44px, 5vw, 64px);
  line-height: 1.08;
  letter-spacing: 0;
}
h2 {
  margin: 0;
  font-size: clamp(32px, 3.5vw, 44px);
  line-height: 1.15;
  letter-spacing: 0;
}
.lead {
  margin: 18px 0 0;
  font-size: clamp(24px, 2.4vw, 32px);
  line-height: 1.42;
  font-weight: 800;
  color: var(--blue);
  max-width: 980px;
}
.note {
  margin: 14px 0 0;
  font-size: clamp(18px, 1.6vw, 22px);
  line-height: 1.58;
  color: var(--muted);
  max-width: 960px;
}
.hero-grid, .two-col {
  display:grid;
  grid-template-columns: minmax(0,1fr) minmax(260px, .85fr);
  gap: 18px;
  align-items: center;
}
.visual-card {
  min-height: 260px;
  border: 1px solid #dce7ff;
  background:
    linear-gradient(135deg, #f8fbff, #fff8d9);
  border-radius: 24px;
  padding: 22px;
  display: grid;
  align-content: center;
  gap: 12px;
}
.big-icon { font-size: clamp(52px, 6vw, 84px); line-height: 1; }
.tag-row { display:flex; flex-wrap:wrap; gap: 10px; margin-top: 18px; }
.tag {
  display:inline-flex;
  align-items:center;
  gap: 6px;
  border-radius: 999px;
  padding: 8px 12px;
  background: #eef4ff;
  color:#17325c;
  border:1px solid #d5e2ff;
  font-weight: 800;
}
.flow {
  display:grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
  margin-top: 20px;
}
.flow-node, .step-card, .box-node {
  background:#f4f8ff;
  border:1px solid #cfe0ff;
  border-radius:18px;
  padding:16px;
  font-size: 20px;
  line-height: 1.45;
}
.flow-node b, .step-card b, .box-node b { display:block; font-size: 22px; margin-bottom: 6px; color:#17325c; }
.mindmap {
  display:grid;
  grid-template-columns: 1fr 1.25fr;
  gap: 18px;
  align-items: center;
  margin-top: 20px;
}
.mind-center {
  border-radius: 24px;
  background:#fff6d6;
  border:1px solid #f3c64b;
  padding:22px;
  font-size: 26px;
  font-weight: 900;
  text-align:center;
}
.mind-branches { display:grid; gap: 12px; }
.mind-branch {
  border: 1px solid #cfe0ff;
  background: #f4f8ff;
  border-radius: 18px;
  padding: 12px 14px;
  font-size: 20px;
}
.table-wrap { overflow:auto; margin-top: 18px; }
table {
  width:100%;
  border-collapse: collapse;
  font-size: clamp(18px, 1.55vw, 21px);
}
th, td {
  border:1px solid var(--line);
  padding: 12px 14px;
  vertical-align: top;
  text-align:left;
}
th { background:#eef4ff; color:#17325c; }
td code { font-size: .95em; }
pre {
  margin: 18px 0 0;
  background:#132033;
  color:#e8f1ff;
  border-radius: 18px;
  padding: 18px 20px;
  overflow:auto;
  max-height: 330px;
}
pre code {
  font-family: var(--mono);
  font-size: clamp(17px, 1.5vw, 21px);
  line-height: 1.62;
  white-space: pre;
}
.terminal {

  border-radius: 16px;
  border:1px solid #bfe6d8;
  background:#eef8f4;
  color:#17483d;
  padding:14px 16px;
  font-family: var(--mono);
  white-space: pre-wrap;
  font-size: clamp(17px, 1.45vw, 20px);
  line-height: 1.55;
  max-height: 230px;
  overflow:auto;

.practice {
  margin-top: 14px;
  border-left: 5px solid var(--brand);
  background:#fffaf0;
  border-radius: 14px;
  padding: 12px 14px;
  font-size: 20px;
  line-height: 1.45;
}
.input-grid {
  display:grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin-top: 18px;
  max-width: 760px;
}
.input-grid label { display:grid; gap: 6px; font-weight: 800; color:#17325c; }
.input-grid input {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 19px;
}
.primary-btn, .option-btn {
  border: 1px solid #d4a800;
  background:#fff6d6;
  color:#4b3410;
  border-radius: 14px;
  padding: 10px 14px;
  font-weight: 900;
}
.primary-btn { margin-top: 14px; }
.options { display:grid; gap: 10px; margin-top: 18px; max-width: 860px; }
.option-btn { text-align:left; font-size: 21px; }
.feedback { min-height: 30px; margin-top: 12px; font-weight: 900; font-size: 21px; }
.pager {
  position: fixed;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  z-index: 20;
  display:flex;
  align-items:center;
  gap: 12px;
  padding: 8px 12px;
  border:1px solid rgba(36,88,211,.18);
  border-radius:999px;
  background:rgba(255,255,255,.94);
  box-shadow:0 14px 34px rgba(31,42,68,.16);
}
.arrow-btn {
  width: 46px;
  height: 46px;
  border:1px solid #cfe0ff;
  border-radius:50%;
  background:#f4f8ff;
  color:#17325c;
  font-size:28px;
  line-height:1;

.arrow-btn:disabled { opacity:.35; cursor:not-allowed; }
.page-count { min-width: 168px; text-align:center; font-weight:900; color:#17325c; }
@media (max-width: 900px) {
  .app-shell, .app-shell.rail-collapsed { grid-template-columns: 1fr; }

  <script>
(() => {
  const lesson = JSON.parse(document.getElementById("lesson-json").textContent);
  let currentModuleIndex = 0;
  let currentPageIndex = 0;
  const storageKey = "lemon-module-lesson:" + lesson.id;
  const saved = JSON.parse(localStorage.getItem(storageKey) || "{}");
  if (Number.isInteger(saved.currentModuleIndex)) currentModuleIndex = saved.currentModuleIndex;
  if (Number.isInteger(saved.currentPageIndex)) currentPageIndex = saved.currentPageIndex;

  const nav = document.getElementById("moduleNav");
  const stage = document.getElementById("stage");
  const pageCount = document.getElementById("pageCount");
  const prevBtn = document.getElementById("prevPage");
  const nextBtn = document.getElementById("nextPage");
  const shell = document.querySelector(".app-shell");

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  }

  function saveState() {
    localStorage.setItem(storageKey, JSON.stringify({ currentModuleIndex, currentPageIndex }));
  }

  function renderNav() {
    nav.innerHTML = lesson.modules.map((module, index) => `
      <button class="nav-button" type="button" data-module="${index}" title="${escapeHtml(module.navTitle)}">
        <span class="nav-index">${index + 1}</span>
        <span class="nav-label">${escapeHtml(module.navTitle)}</span>
      </button>
    `).join("");
    nav.querySelectorAll(".nav-button").forEach(button => {
      button.addEventListener("click", () => goToModule(Number(button.dataset.module)));
    });
  }

  function renderCodeBlock(code) {
    return `<pre><code class="language-python">${escapeHtml(code)}</code></pre>`;
  }

  function renderOutputBlock(output) {
    return `<div class="terminal">${escapeHtml(output || "运行后在终端看到结果。")}</div>`;
  }

  function renderTable(page) {
    const headers = page.headers || [];
    const rows = page.rows || [];
    return `<div class="table-wrap"><table>
      <thead><tr>${headers.map(item => `<th>${escapeHtml(item)}</th>`).join("")}</tr></thead>
      <tbody>${rows.map(row => `<tr>${row.map(cell => `<td>${formatInline(cell)}</td>`).join("")}</tr>`).join("")}</tbody>
    </table></div>`;
  }

  function renderFlow(page) {
    return `<div class="flow">${(page.nodes || []).map(node => `
      <div class="flow-node"><b>${escapeHtml(node.title || node)}</b>${node.text ? `<span>${escapeHtml(node.text)}</span>` : ""}</div>
    `).join("")}</div>`;
  }

  function renderMindMap(page) {
    return `<div class="mindmap">
      <div class="mind-center">${escapeHtml(page.center || page.title)}</div>
      <div class="mind-branches">${(page.branches || []).map(item => `<div class="mind-branch">${formatInline(item)}</div>`).join("")}</div>
    </div>`;
  }

  function renderQuiz(page, pageKey) {
    return `<div class="options">${(page.options || []).map((option, index) => `
      <button class="option-btn" type="button" data-answer="${index}" data-key="${pageKey}">${String.fromCharCode(65 + index)}. ${escapeHtml(option)}</button>
    `).join("")}</div><div class="feedback" id="feedback-${pageKey}" aria-live="polite"></div>`;
  }

  function renderInteractiveDemo(page) {
    if (lesson.id === "lesson-001") {
      return `<div class="input-grid">
        <label>姓名<input id="demoName" value="小明"></label>
        <label>年龄<input id="demoAge" value="9"></label>
        <label>爱好<input id="demoHobby" value="画画"></label>
        <label>喜欢的颜色<input id="demoColor" value="蓝色"></label>
        <label>梦想职业<input id="demoDream" value="科学家"></label>
      </div>
      <button class="primary-btn" type="button" id="makeCard">生成探险员名片</button>
      <div class="terminal" id="demoOutput">点击按钮后，这里会生成文字名片。</div>`;
    }
    return `<div class="input-grid"><label>输入内容<input id="genericInput" value="${escapeHtml(lesson.title)}"></label></div>
      <button class="primary-btn" type="button" id="genericRun">运行实验</button>
      <div class="terminal" id="genericOutput">点击按钮后，这里显示结果。</div>`;
  }

  function formatInline(value) {
    const text = escapeHtml(value);
    return text.replace(/`([^`]+)`/g, "<code>$1</code>");
  }

  function renderCurrentPage() {
    const module = lesson.modules[currentModuleIndex];
    currentPageIndex = Math.max(0, Math.min(currentPageIndex, module.pages.length - 1));
    const page = module.pages[currentPageIndex];
    const pageKey = `${currentModuleIndex}-${currentPageIndex}`;
    let body = "";
    if (page.type === "cover") {
      body = `<div class="hero-grid"><article><p class="eyebrow">${escapeHtml(lesson.subtitle)}</p><h1>${escapeHtml(page.title)}</h1><p class="lead">${escapeHtml(page.subtitle || "")}</p><div class="tag-row">${lesson.concepts.map(item => `<span class="tag">✅ ${escapeHtml(item)}</span>`).join("")}</div></article><div class="visual-card"><div class="big-icon">🚀</div><h2>${escapeHtml(lesson.project)}</h2><p class="note">${escapeHtml(lesson.unit)}</p></div></div>`;
    } else if (page.type === "code") {
      body = `<p class="eyebrow">${escapeHtml(module.navTitle)}</p><h2>${escapeHtml(page.title)}</h2>${page.text ? `<p class="note">${escapeHtml(page.text)}</p>` : ""}${renderCodeBlock(page.code || "")}${renderOutputBlock(page.output)}${page.explain ? `<p class="note">${escapeHtml(page.explain)}</p>` : ""}${page.practice ? `<div class="practice"><b>马上改一改：</b>${escapeHtml(page.practice)}</div>` : ""}`;
    } else if (page.type === "table") {
      body = `<p class="eyebrow">${escapeHtml(module.navTitle)}</p><h2>${escapeHtml(page.title)}</h2>${page.text ? `<p class="lead">${escapeHtml(page.text)}</p>` : ""}${renderTable(page)}`;
    } else if (page.type === "flow") {
      body = `<p class="eyebrow">${escapeHtml(module.navTitle)}</p><h2>${escapeHtml(page.title)}</h2>${page.text ? `<p class="lead">${escapeHtml(page.text)}</p>` : ""}${renderFlow(page)}`;
    } else if (page.type === "mindmap") {
      body = `<p class="eyebrow">${escapeHtml(module.navTitle)}</p><h2>${escapeHtml(page.title)}</h2>${page.text ? `<p class="lead">${escapeHtml(page.text)}</p>` : ""}${renderMindMap(page)}`;
    } else if (page.type === "quiz") {
      body = `<p class="eyebrow">${escapeHtml(module.navTitle)}</p><h2>${escapeHtml(page.title)}</h2><p class="lead">${escapeHtml(page.question)}</p>${renderQuiz(page, pageKey)}`;
    } else if (page.type === "interactive") {
      body = `<p class="eyebrow">${escapeHtml(module.navTitle)}</p><h2>${escapeHtml(page.title)}</h2><p class="lead">${escapeHtml(page.text || "")}</p>${renderInteractiveDemo(page)}`;
    } else {
      body = `<p class="eyebrow">${escapeHtml(module.navTitle)}</p><h2>${escapeHtml(page.title)}</h2>${page.text ? `<p class="lead">${escapeHtml(page.text)}</p>` : ""}${page.note ? `<p class="note">${escapeHtml(page.note)}</p>` : ""}${page.items ? `<div class="tag-row">${page.items.map(item => `<span class="tag">${escapeHtml(item)}</span>`).join("")}</div>` : ""}`;
    }
    stage.innerHTML = `<div class="page">${body}</div>`;
    bindPageEvents(page, pageKey);
    updateProgress();
    saveState();
  }

  function bindPageEvents(page, pageKey) {
    stage.querySelectorAll("[data-answer]").forEach(button => {
      button.addEventListener("click", () => {
        const picked = Number(button.dataset.answer);
        const box = document.getElementById(`feedback-${pageKey}`);
        if (picked === page.answer) {
          box.textContent = page.correct || "答对了，继续下一页。";
          box.style.color = "var(--green)";
        } else {
          box.textContent = page.hint || "再想一想这个知识点的作用。";
          box.style.color = "var(--red)";
        }
      });
    });
    document.getElementById("makeCard")?.addEventListener("click", () => {
      const name = document.getElementById("demoName").value || "小明";
      const age = document.getElementById("demoAge").value || "9";
      const hobby = document.getElementById("demoHobby").value || "画画";
      const color = document.getElementById("demoColor").value || "蓝色";
      const dream = document.getElementById("demoDream").value || "科学家";
      document.getElementById("demoOutput").textContent =
`====================
      探险员名片
====================
姓名：${name}
年龄：${age}
爱好：${hobby}
喜欢的颜色：${color}
梦想职业：${dream}
====================
欢迎登上柠檬号，${name}！`;
    });
    document.getElementById("genericRun")?.addEventListener("click", () => {
      const value = document.getElementById("genericInput").value || lesson.title;
      document.getElementById("genericOutput").textContent = `输入：${value}\n输出：程序已经处理 ${value}`;
    });
  }

  function updateProgress() {
    document.querySelectorAll(".nav-button").forEach((button, index) => {
      button.setAttribute("aria-current", index === currentModuleIndex ? "true" : "false");
    });
    const module = lesson.modules[currentModuleIndex];
    pageCount.textContent = `${module.navTitle}：${currentPageIndex + 1} / ${module.pages.length}`;
    prevBtn.disabled = currentModuleIndex === 0 && currentPageIndex === 0;
    nextBtn.disabled = currentModuleIndex === lesson.modules.length - 1 && currentPageIndex === module.pages.length - 1;
    document.querySelectorAll(".nav-button")[currentModuleIndex]?.scrollIntoView({ block: "nearest" });
  }

  function goToModule(index) {
    currentModuleIndex = Math.max(0, Math.min(index, lesson.modules.length - 1));
    currentPageIndex = 0;
    renderCurrentPage();
  }

  function goNext() {
    const module = lesson.modules[currentModuleIndex];
    if (currentPageIndex < module.pages.length - 1) {
      currentPageIndex += 1;
    } else if (currentModuleIndex < lesson.modules.length - 1) {
      currentModuleIndex += 1;
      currentPageIndex = 0;
    }
    renderCurrentPage();
  }

  function goPrev() {
    if (currentPageIndex > 0) {
      currentPageIndex -= 1;
    } else if (currentModuleIndex > 0) {
      currentModuleIndex -= 1;
      currentPageIndex = lesson.modules[currentModuleIndex].pages.length - 1;
    }
    renderCurrentPage();
  }

  function validateLesson(lesson) {
    const issues = [];
    let pageTotal = 0;
    lesson.modules.forEach((module, moduleIndex) => {
      if (!module.navTitle) issues.push(`模块 ${moduleIndex + 1} 缺少 navTitle`);
      if (!module.pages || module.pages.length === 0) issues.push(`${module.navTitle} 没有页面`);
      pageTotal += module.pages?.length || 0;
      (module.pages || []).forEach((page, pageIndex) => {
        if (page.type === "code" && !page.output) issues.push(`${module.navTitle} 第 ${pageIndex + 1} 页代码缺少 output`);
        if (page.type === "quiz" && (typeof page.answer !== "number" || !page.hint)) issues.push(`${module.navTitle} 第 ${pageIndex + 1} 题缺少答案或提示`);
        if (page.code && /\\n(if|for|while|def|class)\\b/.test(page.code) && !/\\n    /.test(page.code)) issues.push(`${module.navTitle} 第 ${pageIndex + 1} 页代码可能缺少缩进`);
      });
      if (module.kind === "concept" && !module.isFunction && module.pages?.some(page => page.type === "params")) {
        issues.push(`${module.navTitle} 是非函数知识点但出现参数页`);
      }
    });
    if (!lesson.unit) issues.push("课程未归入单元");
    if (!lesson.project) issues.push("课程缺少项目作品");
    const htmlText = document.documentElement.outerHTML;
    if (new RegExp("p" + "ic/").test(htmlText)) issues.push("存在课程图片引用");
    if (new RegExp("--bg" + "-art|--character" + "-art|--mark" + "-art").test(htmlText)) issues.push("存在旧图片 CSS 变量");
    if (new RegExp("background(?:-image)?\\\\s*:\\\\s*u" + "rl", "i").test(htmlText)) issues.push("存在背景图片引用");
    console.group(`validateLesson: ${lesson.title}`);
    console.log({ modules: lesson.modules.length, pages: pageTotal, issues });
    console.groupEnd();
    return { modules: lesson.modules.length, pages: pageTotal, issues };
  }

  document.getElementById("toggleRail").addEventListener("click", () => {
    shell.classList.toggle("rail-collapsed");
    const collapsed = shell.classList.contains("rail-collapsed");
    document.getElementById("toggleRail").setAttribute("aria-expanded", String(!collapsed));
  });
  prevBtn.addEventListener("click", goPrev);
  nextBtn.addEventListener("click", goNext);
  document.addEventListener("keydown", event => {
    const tag = document.activeElement ? document.activeElement.tagName : "";
    if (["INPUT", "TEXTAREA", "SELECT"].includes(tag)) return;
    if (event.key === "ArrowLeft") goPrev();
    if (event.key === "ArrowRight") goNext();
  });

  window.validateLesson = validateLesson;
  renderNav();
  currentModuleIndex = Math.max(0, Math.min(currentModuleIndex, lesson.modules.length - 1));
  currentPageIndex = Math.max(0, Math.min(currentPageIndex, lesson.modules[currentModuleIndex].pages.length - 1));
  renderCurrentPage();
  validateLesson(lesson);
})();
</script>
</body>
</html>
