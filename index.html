<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="学生编程作品展示主页，点击学生卡片进入对应作品文件夹。"
    />
    <title>学生编程作品展示</title>
    <style>
      :root {
        color: #f7fbff;
        background: #02030a;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-width: 320px;
        min-height: 100%;
        margin: 0;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 50% 14%, rgba(44, 128, 255, 0.32), transparent 34rem),
          radial-gradient(circle at 20% 66%, rgba(156, 83, 255, 0.2), transparent 28rem),
          linear-gradient(180deg, #02030a 0%, #06122a 46%, #02030a 100%);
      }

      #root {
        min-height: 100vh;
      }

      #static-background {
        position: fixed;
        inset: 0;
        z-index: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .static-shell {
        position: relative;
        z-index: 1;
        display: grid;
        width: min(1500px, calc(100% - 42px));
        min-height: 100vh;
        margin: 0 auto;
        padding: 38px 0 34px;
        place-items: center;
        text-align: center;
      }

      .static-title {
        max-width: 1100px;
        margin: 0 auto 18px;
        color: transparent;
        font-size: clamp(3rem, 8vw, 7rem);
        font-weight: 950;
        line-height: 0.98;
        letter-spacing: 0;
        background: linear-gradient(180deg, #ffffff 0%, #94eeff 58%, #b383ff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-stroke: 1px rgba(255, 255, 255, 0.22);
        text-shadow:
          0 0 22px rgba(255, 255, 255, 0.34),
          0 0 52px rgba(74, 232, 255, 0.44),
          0 0 82px rgba(157, 93, 255, 0.34);
      }

      .static-subtitle {
        margin: 0 auto 34px;
        color: rgba(236, 244, 255, 0.92);
        font-size: clamp(1.15rem, 2.2vw, 1.8rem);
        font-weight: 760;
        text-shadow: 0 0 18px rgba(77, 232, 255, 0.35);
      }

      .static-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
        width: min(980px, 100%);
      }

      .static-card {
        position: relative;
        display: grid;
        min-height: 116px;
        padding: 20px;
        place-items: center;
        overflow: hidden;
        color: #f7fbff;
        text-decoration: none;
        border: 1px solid rgba(96, 218, 255, 0.72);
        border-radius: 8px;
        background:
          linear-gradient(135deg, rgba(58, 166, 255, 0.18), rgba(125, 72, 255, 0.12)),
          rgba(8, 18, 48, 0.62);
        box-shadow:
          inset 0 0 28px rgba(74, 232, 255, 0.1),
          0 18px 46px rgba(0, 0, 0, 0.34),
          0 0 22px rgba(65, 184, 255, 0.24);
      }

      .static-card span {
        color: #ffffff;
        font-size: clamp(1.8rem, 4vw, 2.5rem);
        font-weight: 900;
        text-shadow: 0 0 16px rgba(74, 232, 255, 0.42);
      }

      .static-footer {
        margin-top: 32px;
        color: rgba(205, 222, 255, 0.62);
      }

      @media (max-width: 820px) {
        .static-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 560px) {
        .static-shell {
          width: min(430px, calc(100% - 22px));
        }

        .static-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="static-background" aria-hidden="true"></canvas>
    <div id="root">
      <main class="static-shell">
        <section aria-labelledby="static-title">
          <h1 class="static-title" id="static-title">学生编程作品展示</h1>
          <p class="static-subtitle">探索每位同学的创意程序</p>
          <div class="static-grid" aria-label="学生作品入口">
            <a class="static-card" href="/hank/"><span>Hank</span></a>
            <a class="static-card" href="/mavis/"><span>Mavis</span></a>
            <a class="static-card" href="/qiu/"><span>Qiu</span></a>
            <a class="static-card" href="/seven/"><span>Seven</span></a>
            <a class="static-card" href="/wang/"><span>Wang</span></a>
            <a class="static-card" href="/wrong/"><span>Wrong</span></a>
          </div>
        </section>
        <footer class="static-footer">Powered by Lemon Maker Coding School</footer>
      </main>
    </div>
    <script>
      (() => {
        const canvas = document.getElementById("static-background");
        const ctx = canvas.getContext("2d");
        let stars = [];
        let animationId = 0;

        const resize = () => {
          const ratio = Math.min(window.devicePixelRatio || 1, 1.7);
          canvas.width = Math.floor(window.innerWidth * ratio);
          canvas.height = Math.floor(window.innerHeight * ratio);
          canvas.style.width = `${window.innerWidth}px`;
          canvas.style.height = `${window.innerHeight}px`;
          ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
          stars = Array.from({ length: window.innerWidth < 680 ? 90 : 150 }, () => ({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            r: 0.5 + Math.random() * 1.5,
            a: 0.25 + Math.random() * 0.65,
          }));
        };

        const draw = (time) => {
          const width = window.innerWidth;
          const height = window.innerHeight;
          ctx.clearRect(0, 0, width, height);
          ctx.fillStyle = "#02030a";
          ctx.fillRect(0, 0, width, height);
          stars.forEach((star) => {
            const y = (star.y + time * 0.018) % height;
            ctx.beginPath();
            ctx.arc(star.x, y, star.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(74, 232, 255, ${star.a})`;
            ctx.fill();
          });
          animationId = window.requestAnimationFrame(draw);
        };

        window.addEventListener("resize", resize, { passive: true });
        resize();
        animationId = window.requestAnimationFrame(draw);
        window.addEventListener("beforeunload", () => window.cancelAnimationFrame(animationId));
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
