<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>接水果小游戏</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #7dd3fc, #d9f99d);
      overflow: hidden;
      touch-action: none;
    }

    #game {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .hud {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: #083344;
      font-weight: 800;
      font-size: 18px;
    }

    .pill {
      background: rgba(255, 255, 255, 0.75);
      padding: 8px 12px;
      border-radius: 999px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
    }

    #basket {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      width: 92px;
      height: 58px;
      border-radius: 12px 12px 28px 28px;
      background: linear-gradient(180deg, #f97316, #9a3412);
      box-shadow: inset 0 -8px rgba(0, 0, 0, 0.18), 0 8px 18px rgba(0, 0, 0, 0.2);
    }

    #basket::before {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      top: -18px;
      height: 28px;
      border: 7px solid #92400e;
      border-bottom: none;
      border-radius: 40px 40px 0 0;
    }

    .fruit {
      position: absolute;
      font-size: 34px;
      line-height: 1;
      filter: drop-shadow(0 5px 5px rgba(0, 0, 0, 0.2));
    }

    #startScreen,
    #endScreen {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(8, 47, 73, 0.35);
      backdrop-filter: blur(8px);
    }

    .card {
      width: min(92vw, 420px);
      padding: 26px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.92);
      text-align: center;
      color: #083344;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.22);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 34px;
    }

    p {
      margin: 10px 0;
      font-size: 16px;
      line-height: 1.6;
    }

    button {
      margin-top: 18px;
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 15px 18px;
      font-size: 20px;
      font-weight: 900;
      color: white;
      background: linear-gradient(135deg, #06b6d4, #22c55e);
      box-shadow: 0 10px 20px rgba(34, 197, 94, 0.35);
      cursor: pointer;
    }

    .hint {
      margin-top: 16px;
      font-size: 14px;
      color: #475569;
    }
  </style>
</head>
<body>
  <div id="game">
    <div class="hud">
      <div class="pill">得分：<span id="score">0</span></div>
      <div class="pill">时间：<span id="time">30</span>s</div>
    </div>

    <div id="basket"></div>

    <div id="startScreen">
      <div class="card">
        <h1>🍎 接水果</h1>
        <p>左右拖动篮子，接住掉下来的水果。</p>
        <p>30 秒内看看你能拿多少分！</p>
        <button id="startBtn">开始游戏</button>
        <div class="hint">手机端：手指拖动篮子<br>电脑端：鼠标拖动篮子</div>
      </div>
    </div>

    <div id="endScreen" style="display: none;">
      <div class="card">
        <h1>🎉 游戏结束</h1>
        <p>你的最终得分是：</p>
        <h1 id="finalScore">0</h1>
        <button id="restartBtn">再玩一次</button>
      </div>
    </div>
  </div>

  <script>
    const game = document.getElementById("game");
    const basket = document.getElementById("basket");
    const scoreEl = document.getElementById("score");
    const timeEl = document.getElementById("time");
    const startScreen = document.getElementById("startScreen");
    const endScreen = document.getElementById("endScreen");
    const finalScoreEl = document.getElementById("finalScore");
    const startBtn = document.getElementById("startBtn");
    const restartBtn = document.getElementById("restartBtn");

    let score = 0;
    let timeLeft = 30;
    let isPlaying = false;
    let fruitTimer = null;
    let countdownTimer = null;
    let animationId = null;
    let fruits = [];

    const fruitIcons = ["🍎", "🍌", "🍓", "🍊", "🍇", "🥝"];

    function resetGame() {
      score = 0;
      timeLeft = 30;
      scoreEl.textContent = score;
      timeEl.textContent = timeLeft;
      fruits.forEach(fruit => fruit.el.remove());
      fruits = [];
      basket.style.left = "50%";
    }

    function startGame() {
      resetGame();
      isPlaying = true;
      startScreen.style.display = "none";
      endScreen.style.display = "none";

      fruitTimer = setInterval(createFruit, 650);
      countdownTimer = setInterval(() => {
        timeLeft--;
        timeEl.textContent = timeLeft;
        if (timeLeft <= 0) endGame();
      }, 1000);

      gameLoop();
    }

    function endGame() {
      isPlaying = false;
      clearInterval(fruitTimer);
      clearInterval(countdownTimer);
      cancelAnimationFrame(animationId);
      finalScoreEl.textContent = score;
      endScreen.style.display = "flex";
    }

    function createFruit() {
      const el = document.createElement("div");
      el.className = "fruit";
      el.textContent = fruitIcons[Math.floor(Math.random() * fruitIcons.length)];

      const x = Math.random() * (window.innerWidth - 40);
      const speed = 2.5 + Math.random() * 2.5 + score * 0.015;

      el.style.left = x + "px";
      el.style.top = "-45px";
      game.appendChild(el);

      fruits.push({ el, x, y: -45, speed });
    }

    function gameLoop() {
      if (!isPlaying) return;

      const basketRect = basket.getBoundingClientRect();

      fruits.forEach((fruit, index) => {
        fruit.y += fruit.speed;
        fruit.el.style.top = fruit.y + "px";

        const fruitRect = fruit.el.getBoundingClientRect();
        const isCaught =
          fruitRect.bottom >= basketRect.top &&
          fruitRect.top <= basketRect.bottom &&
          fruitRect.right >= basketRect.left &&
          fruitRect.left <= basketRect.right;

        if (isCaught) {
          score += 10;
          scoreEl.textContent = score;
          fruit.el.remove();
          fruits.splice(index, 1);
        } else if (fruit.y > window.innerHeight + 60) {
          fruit.el.remove();
          fruits.splice(index, 1);
        }
      });

      animationId = requestAnimationFrame(gameLoop);
    }

    function moveBasket(clientX) {
      const half = basket.offsetWidth / 2;
      let x = clientX;
      if (x < half) x = half;
      if (x > window.innerWidth - half) x = window.innerWidth - half;
      basket.style.left = x + "px";
    }

    game.addEventListener("touchmove", (e) => {
      if (!isPlaying) return;
      moveBasket(e.touches[0].clientX);
    }, { passive: false });

    game.addEventListener("mousemove", (e) => {
      if (!isPlaying) return;
      moveBasket(e.clientX);
    });

    startBtn.addEventListener("click", startGame);
    restartBtn.addEventListener("click", startGame);
  </script>
</body>
</html>
